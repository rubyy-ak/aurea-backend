spring.application.name=aurea
server.port=${PORT:8080}

# Lokale Entwicklung: H2-Datei-Datenbank. In Produktion überschreibt das Profil "prod" (Postgres).
spring.datasource.url=jdbc:h2:file:./data/aurea-dev
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.auth.token-validity-days=7
app.weather.latitude=52.52
app.weather.longitude=13.405
